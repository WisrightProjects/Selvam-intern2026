<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="human.css">
</head>
<body>

<div class="container">

    <h1>Personal Expense Tracker</h1>

    <!-- Login Form -->
    <div class="login-box">
        <h2>Login</h2>

        <input type="text" placeholder="Username">

        <input type="email" placeholder="Email">

        <input type="email" placeholder="Re-enter Email">

        <input type="password" placeholder="4 Digit Password">

        <input type="password" placeholder="Re-enter Password">

        <button>Login</button>
    </div>

    <!-- Expense Form -->
    <div class="expense-box">

        <h2>Monthly Expenses</h2>

        <input type="number" placeholder="Monthly Salary">

        <input type="number" placeholder="Family Expense">

        <input type="number" placeholder="Shopping Expense">

        <input type="number" placeholder="Food Expense">

        <input type="number" placeholder="Bike Petrol Expense">

        <input type="number" placeholder="Current Bill">

        <input type="number" placeholder="Hospital Expense">

        <input type="number" placeholder="Other Expense">

        <button id="btn">Calculate</button>

    </div>

    <!-- Result Section -->
    <div class="result-box">

        <h2>Expense Report</h2>

        <p class="total">Total Expenses: ₹0</p>

        <p class="saving">Savings: ₹0</p>

    </div>

</div>

<script src="human.js"></script>


</body>
</html>
